<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhododendron 2.0</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- JSZip for exporting and importing data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --sidebar-bg: #0b1120;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --user-msg: #2563eb;
            --ai-msg: #334155;
            --error: #ef4444;
            --hover: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
            padding: 1rem;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 1.5rem;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .sidebar-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 0.5rem;
            width: 100%;
            text-align: left;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-btn:hover { background-color: var(--hover); }
        .sidebar-btn.active { background-color: var(--accent); border-color: var(--accent); }

        .new-btn { background-color: var(--accent); border: none; font-weight: bold; justify-content: center; }
        .new-btn:hover { background-color: #2563eb; }

        /* Main Chat Area */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--chat-bg);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        header h1 { margin: 0; font-size: 1.2rem; }

        select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 0.5rem;
            border-radius: 0.5rem;
            outline: none;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 0.5rem;
            line-height: 1.5;
        }

        .user-message { background-color: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 0; }
        .ai-message { background-color: var(--ai-msg); align-self: flex-start; border-bottom-left-radius: 0; }
        .ai-message pre { background-color: #0f172a; padding: 1rem; border-radius: 0.25rem; overflow-x: auto; }
        .ai-message code { font-family: monospace; }

        /* SVG Rendering */
        .svg-render {
            margin-top: 10px;
            padding: 10px;
            background: #ffffff;
            border-radius: 8px;
            display: inline-block;
        }
        
        .svg-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 0.25rem;
            cursor: pointer;
            margin-top: 5px;
            display: block;
        }

        .input-area {
            display: flex;
            padding: 1rem;
            background-color: var(--chat-bg);
            border-top: 1px solid #334155;
        }

        input[type="text"], textarea {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background-color: var(--bg-color);
            color: white;
            outline: none;
        }

        button.send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin-left: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background-color: var(--chat-bg); padding: 2rem; border-radius: 0.5rem; max-width: 500px; width: 90%;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .modal-content h2 { margin-top: 0; }
        .modal-btn { background-color: var(--accent); color: white; border: none; padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Sidebar: Chats, Gems, Data -->
    <div id="sidebar">
        <button class="sidebar-btn new-btn" onclick="startNewChat()">+ New Chat</button>
        
        <div class="sidebar-section" style="margin-top: 1rem;">
            <div class="sidebar-title">Recent Chats</div>
            <div id="chat-list"></div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">My Gems</div>
            <button class="sidebar-btn" onclick="openGemModal()" style="border-style: dashed;">+ Create Gem</button>
            <div id="gem-list"></div>
        </div>

        <div class="sidebar-section" style="margin-top: auto;">
            <div class="sidebar-title">Data Management</div>
            <button class="sidebar-btn" onclick="exportData()">📦 Export to ZIP</button>
            <button class="sidebar-btn" onclick="document.getElementById('import-file').click()">📥 Import from ZIP</button>
            <input type="file" id="import-file" style="display: none;" accept=".zip">
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="main-area">
        <header>
            <h1 id="header-title">Rhododendron 2.0</h1>
            <select id="model-select">
                <option value="rhododendron/galla:1">Galla 1</option>
                <option value="rhododendron/galla:1-pro">Galla 1 Pro</option>
            </select>
        </header>

        <div id="chat-container">
            <div class="message ai-message">Welcome! Start typing to begin a new conversation, or create a Gem in the sidebar to give me custom instructions.</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Message Rhododendron..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Create Gem Modal -->
    <div id="gem-modal" class="modal">
        <div class="modal-content">
            <h2>Create a Gem</h2>
            <input type="text" id="gem-name" placeholder="Gem Name (e.g. Coding Expert)">
            <textarea id="gem-prompt" rows="5" placeholder="System instructions (e.g. You are a Python expert. Only reply in code.)"></textarea>
            <button class="modal-btn" onclick="saveGem()">Save Gem</button>
            <button class="modal-btn" style="background-color: #475569;" onclick="closeModal('gem-modal')">Cancel</button>
        </div>
    </div>

    <script>
        const OLLAMA_URL = "http://localhost:11434";
        
        // Database & State Management
        let db;
        let currentChatId = null;
        let activeGemId = null;

        const request = indexedDB.open("RhododendronDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("chats")) db.createObjectStore("chats", { keyPath: "id" });
            if (!db.objectStoreNames.contains("gems")) db.createObjectStore("gems", { keyPath: "id" });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadSidebar();
        };

        // --- UI & Rendering ---
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function startNewChat() {
            currentChatId = generateId();
            const tx = db.transaction("chats", "readwrite");
            tx.objectStore("chats").put({ id: currentChatId, title: "New Chat", messages: [], timestamp: Date.now() });
            tx.oncomplete = () => {
                document.getElementById('chat-container').innerHTML = '';
                loadSidebar();
            };
        }

        function loadChat(id) {
            currentChatId = id;
            db.transaction("chats").objectStore("chats").get(id).onsuccess = (e) => {
                const chat = e.target.result;
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                if(chat && chat.messages) {
                    chat.messages.forEach(m => renderMessage(m.sender, m.text));
                }
            };
        }

        function renderMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            
            if (sender === 'ai') {
                let formattedText = marked.parse(text);
                const svgRegex = /<svg[\s\S]*?<\/svg>/gi;
                const svgs = text.match(svgRegex);
                
                if (svgs) {
                    svgs.forEach((svgCode, i) => {
                        const svgId = 'svg-' + Date.now() + '-' + i;
                        formattedText += `<br>
                        <div class="svg-render" id="${svgId}">${svgCode}</div>
                        <button class="svg-btn" onclick="downloadSvgElement('${svgId}')">Download SVG</button>`;
                    });
                }
                msgDiv.innerHTML = formattedText;
            } else {
                msgDiv.innerText = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function downloadSvgElement(id) {
            const svgCode = document.getElementById(id).innerHTML;
            const blob = new Blob([svgCode], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "rhododendron_image.svg"; 
            a.click();
        }

        // --- Sidebar Logic ---
        function loadSidebar() {
            // Load Chats
            db.transaction("chats").objectStore("chats").getAll().onsuccess = (e) => {
                const chats = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                const list = document.getElementById('chat-list');
                list.innerHTML = '';
                chats.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'sidebar-btn';
                    btn.innerText = c.title || "Untitled Chat";
                    btn.onclick = () => loadChat(c.id);
                    list.appendChild(btn);
                });
            };

            // Load Gems
            db.transaction("gems").objectStore("gems").getAll().onsuccess = (e) => {
                const gems = e.target.result;
                const list = document.getElementById('gem-list');
                list.innerHTML = '';
                
                // Default No-Gem Option
                const defaultBtn = document.createElement('button');
                defaultBtn.className = `sidebar-btn ${!activeGemId ? 'active' : ''}`;
                defaultBtn.innerText = "Default Model";
                defaultBtn.onclick = () => activateGem(null);
                list.appendChild(defaultBtn);

                gems.forEach(g => {
                    const btn = document.createElement('button');
                    btn.className = `sidebar-btn ${activeGemId === g.id ? 'active' : ''}`;
                    btn.innerText = '💎 ' + g.name;
                    btn.onclick = () => activateGem(g.id);
                    list.appendChild(btn);
                });
            };
        }

        function openGemModal() { document.getElementById('gem-modal').style.display = 'flex'; }
        
        function saveGem() {
            const name = document.getElementById('gem-name').value;
            const prompt = document.getElementById('gem-prompt').value;
            if(!name) return;
            
            const gem = { id: generateId(), name, systemPrompt: prompt };
            db.transaction("gems", "readwrite").objectStore("gems").put(gem).onsuccess = () => {
                closeModal('gem-modal');
                document.getElementById('gem-name').value = '';
                document.getElementById('gem-prompt').value = '';
                loadSidebar();
            };
        }

        function activateGem(id) {
            activeGemId = id;
            document.getElementById('header-title').innerText = id ? "Rhododendron 2.0 (Gem Active)" : "Rhododendron 2.0";
            loadSidebar();
        }

        // --- Export / Import ---
        function exportData() {
            Promise.all([
                new Promise(res => db.transaction("chats").objectStore("chats").getAll().onsuccess = e => res(e.target.result)),
                new Promise(res => db.transaction("gems").objectStore("gems").getAll().onsuccess = e => res(e.target.result))
            ]).then(([chats, gems]) => {
                const zip = new JSZip();
                zip.file("rhododendron_export.json", JSON.stringify({ chats, gems }));
                zip.generateAsync({type:"blob"}).then(blob => {
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "Rhododendron_Data.zip";
                    a.click();
                });
            });
        }

        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            JSZip.loadAsync(file).then(zip => zip.file("rhododendron_export.json").async("string"))
            .then(content => {
                const data = JSON.parse(content);
                const tx = db.transaction(["chats", "gems"], "readwrite");
                data.chats.forEach(c => tx.objectStore("chats").put(c));
                data.gems.forEach(g => tx.objectStore("gems").put(g));
                tx.oncomplete = () => { alert("Data imported successfully!"); location.reload(); };
            });
        });

        // --- Messaging & API ---
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;
            inputField.value = "";

            if (!currentChatId) startNewChat();

            // Save user message
            db.transaction("chats").objectStore("chats").get(currentChatId).onsuccess = async (e) => {
                const chat = e.target.result;
                if(chat.messages.length === 0) chat.title = text.substring(0, 25) + "..."; // Auto-title
                chat.messages.push({ sender: 'user', text });
                chat.timestamp = Date.now();
                db.transaction("chats", "readwrite").objectStore("chats").put(chat);
                
                renderMessage("user", text);
                loadSidebar(); // Update title

                // Prepare context for Ollama (Memory)
                let apiMessages = [];
                
                // Inject Gem system prompt if active
                if (activeGemId) {
                    const gemTx = await new Promise(res => db.transaction("gems").objectStore("gems").get(activeGemId).onsuccess = ev => res(ev.target.result));
                    if(gemTx && gemTx.systemPrompt) {
                        apiMessages.push({ role: "system", content: gemTx.systemPrompt });
                    }
                }

                // Add past conversation context
                chat.messages.forEach(m => {
                    apiMessages.push({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text });
                });

                // Generate Placeholder
                const chatContainer = document.getElementById("chat-container");
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai-message";
                aiMsgDiv.innerText = "Thinking...";
                chatContainer.appendChild(aiMsgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                try {
                    const selectedModel = document.getElementById("model-select").value;
                    const response = await fetch(`${OLLAMA_URL}/api/chat`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: selectedModel,
                            messages: apiMessages,
                            stream: false
                        })
                    });

                    if (!response.ok) throw new Error("API Error");
                    const data = await response.json();
                    const aiReply = data.message.content;

                    // Remove placeholder, render real, save to DB
                    chatContainer.removeChild(aiMsgDiv);
                    renderMessage("ai", aiReply);

                    chat.messages.push({ sender: 'ai', text: aiReply });
                    db.transaction("chats", "readwrite").objectStore("chats").put(chat);

                } catch (error) {
                    aiMsgDiv.innerText = "Error: Ensure Ollama is running with OLLAMA_ORIGINS='*'";
                    aiMsgDiv.style.color = "var(--error)";
                }
            };
        }
    </script>
</body>
</html>
